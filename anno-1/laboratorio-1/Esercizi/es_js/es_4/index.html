    <title>Grafici di alcune funzioni</title>

</head>

<body>
    <canvas id="canvas" width="600" height="600"></canvas>

    <br>
    <div id="bottoni_comandi" class="bottoni">
        <p>Clicca uno sei seguenti bottoni per disegnare la funzione corrispondente</p>

        <button id="button_1" type="button">f(x) = x/2-1</button>
        <button id="button_2" type="button">f(x) = (x+0.1)^2</button>
        <button id="button_3" type="button">f(x)=log(x)</button>
        <button id="button_4" type="button">f(x) = 3x+2</button>
        <button id="button_5" type="button">f(x) = x^2</button>
        <button id="button_6" type="button">f(x) = 2^x</button>

    </div>
